[package]
name = "compsize-tree"
version = "0.2.0"
edition = "2021"
description = "Extent-accurate btrfs disk usage in one pass, with a GTK4 browser"
license = "GPL-2.0-or-later"

[[bin]]
name = "compsize-tree"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
pangocairo = "0.22"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
